<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Morning, Mahi</title>
    <style>
        /* General Reset */
        body, h1, p {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
        }

        /* Body Styling */
        body {
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* Container Styling */
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
        }

        /* Heading Styling */
        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #2c3e50;
        }

        /* Paragraph Styling */
        p {
            font-size: 1.2rem;
            line-height: 1.6;
            color: #7f8c8d;
        }

        /* Image Styling */
        .nature-img {
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
            display: block;
            border-radius: 10px;
        }

        /* Button Styling */
        .btn {
            background-color: #3498db;
            color: #ffffff;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Good Morning, Mahi! 🌞</h1>
        <p>Wishing you a day filled with joy, positivity, and success. Start your morning with a smile and make today amazing!</p>
        <img src="https://i.pinimg.com/736x/4e/9d/7e/4e9d7e65a46300774be5ee9105ae9672.jpg" alt="Nature" class="nature-img">
        <button class="btn" onclick="alert('Have a wonderful day, Mahi!')">Click for a Surprise</button>
    </div>
</body>
</html>
